[tox]
envlist =
    py{310,311,312}-dj42
    py{310,311,312}-dj50
    py{310,311,312,313}-dj51
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60
    py{312,313,314}-dj61

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/plans_payments
    dj42: DJANGO_DEP=Django>=4.2,<5.0
    dj50: DJANGO_DEP=Django>=5.0,<5.1
    dj51: DJANGO_DEP=Django>=5.1,<5.2
    dj52: DJANGO_DEP=Django>=5.2,<6.0
    dj60: DJANGO_DEP=Django>=6.0,<6.1
    dj61: DJANGO_DEP=Django>=6.1,<6.2
commands =
    python -m pip install -U pip
    python -m pip install -r{toxinidir}/requirements_test.txt
    # Install Django last to ensure correct version is installed
    python -m pip install {env:DJANGO_DEP}
    # The django-payments fork commit BlenderKit runs in production (branch blendkit-pin-2026-08):
    # PyPI django-payments has no Payment.autocomplete_with_wallet, which renew_accounts() calls.
    python -m pip install git+https://github.com/PetrDlouhy/django-payments@a108028a7690d3eff2d89872cea3fdb0e030e037#egg=django-payments
    python --version
    python manage.py --version
    python -W error::DeprecationWarning -m coverage run manage.py test
deps =
    -r{toxinidir}/requirements_test.txt
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
