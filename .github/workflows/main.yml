# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    strategy:
      matrix:
        # Each Django version on the Python versions it supports.
        include:
          - {DJANGO_VERSION: '4.2.*', python-version: '3.10'}
          - {DJANGO_VERSION: '4.2.*', python-version: '3.11'}
          - {DJANGO_VERSION: '4.2.*', python-version: '3.12'}
          - {DJANGO_VERSION: '5.0.*', python-version: '3.10'}
          - {DJANGO_VERSION: '5.0.*', python-version: '3.11'}
          - {DJANGO_VERSION: '5.0.*', python-version: '3.12'}
          - {DJANGO_VERSION: '5.1.*', python-version: '3.10'}
          - {DJANGO_VERSION: '5.1.*', python-version: '3.11'}
          - {DJANGO_VERSION: '5.1.*', python-version: '3.12'}
          - {DJANGO_VERSION: '5.1.*', python-version: '3.13'}
          - {DJANGO_VERSION: '5.2.*', python-version: '3.10'}
          - {DJANGO_VERSION: '5.2.*', python-version: '3.11'}
          - {DJANGO_VERSION: '5.2.*', python-version: '3.12'}
          - {DJANGO_VERSION: '5.2.*', python-version: '3.13'}
          - {DJANGO_VERSION: '5.2.*', python-version: '3.14'}
          - {DJANGO_VERSION: '6.0.*', python-version: '3.12'}
          - {DJANGO_VERSION: '6.0.*', python-version: '3.13'}
          - {DJANGO_VERSION: '6.0.*', python-version: '3.14'}
          - {DJANGO_VERSION: '6.1.*', python-version: '3.12'}
          - {DJANGO_VERSION: '6.1.*', python-version: '3.13'}
          - {DJANGO_VERSION: '6.1.*', python-version: '3.14'}
      fail-fast: false

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('setup.py') }}-${{ hashFiles('requirements_test.txt') }}-${{ hashFiles('requirements.txt') }}-${{ matrix.DJANGO_VERSION }}

      - name: Install
        run: |
           pip install -e .
           pip install --upgrade --upgrade-strategy eager -r requirements_test.txt
           pip install Django==${{ matrix.DJANGO_VERSION }}

      - name: Testing
        run: |
          python manage.py makemigrations plans_payments --check --dry-run
          tox -e py`echo ${{matrix.python-version}} | sed s/\\\.//g`-dj`echo ${{matrix.DJANGO_VERSION}} | sed s/[.*]//g`
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: django${{ matrix.DJANGO_VERSION }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements_test.txt
      - name: Run pre-commit
        run: pre-commit run --all-files
